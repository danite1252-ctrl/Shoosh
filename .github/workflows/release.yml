# Builds a signed Shoosh APK and publishes it as a GitHub release.
# Run it from the Actions tab: Release → Run workflow → type the version (e.g. 1.4).
# The app checks these releases and offers the update in-app.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.4 or 1.4.1 (must be higher than the last one)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version number
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]; then
            echo "::error::Version must look like 1.4 or 1.4.1"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's machines already have the Android SDK; just accept its licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 secret first (see README)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shoosh.jks"

      - name: Build signed APK
        env:
          SHOOSH_KEYSTORE: ${{ runner.temp }}/shoosh.jks
          SHOOSH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHOOSH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHOOSH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PshooshVersion="$VERSION" \
            -PshooshUpdateRepo="$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=app/build/outputs/apk/release
          CODE=$(python3 -c "import json;print(json.load(open('$OUT/output-metadata.json'))['elements'][0]['versionCode'])")
          cp "$OUT/app-release.apk" "shoosh-$CODE.apk"
          gh release create "v$VERSION" "shoosh-$CODE.apk" \
            --title "Shoosh $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
